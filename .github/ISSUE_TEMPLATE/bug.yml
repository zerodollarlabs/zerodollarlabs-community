name: Report a bug
description: Help us reproduce a problem with a tool.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: 'This issue is public. Redact tokens, email addresses, clipboard content, personal paths and location data. Report security vulnerabilities privately using SECURITY.md.'
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: Notch
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Review and redact personal paths, locations and private data before posting.
      render: text
